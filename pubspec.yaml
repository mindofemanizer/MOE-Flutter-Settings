name: moe_flutter_settings
description: Settings package for MOE Flutter ecosystem — global key-value settings, cached, typed
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  moe_flutter_core:
    git:
      url: https://github.com/mindofemanizer/MOE-Flutter-Core.git
      ref: v1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.4
